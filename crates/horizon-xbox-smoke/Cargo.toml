[package]
name = "horizon-xbox-smoke"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "A minimal Xbox UWP app that proves the CoreWindow and DX12 stack before the game is wired to it"

[[bin]]
name = "horizon-xbox-smoke"
path = "src/main.rs"

# Xbox only. On every other target the binary is a stub that says so, so the
# workspace still builds everywhere.
[target.'cfg(target_vendor = "uwp")'.dependencies]
horizon-platform-uwp = { path = "../horizon-platform-uwp" }
log = "0.4"
pollster = "0.4"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }

[lints]
workspace = true
